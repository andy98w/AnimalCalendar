name: Calendar reliability
on:
  push:
    branches: [master, main, codex/calendar-correctness]
  pull_request:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsx --test tests/dates.test.ts
      - run: npx firebase emulators:exec --project demo-animalcalendar --only database,firestore 'node --test tests/rules.test.mjs'
